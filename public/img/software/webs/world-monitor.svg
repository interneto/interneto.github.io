<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#0a0a0a" rx="8"/>

  <!-- Glow effect -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>

  <!-- Globe wireframe -->
  <g fill="none" stroke="#00ff41" stroke-width="1.2" filter="url(#neon)" opacity="0.9">
    <!-- Main circle -->
    <circle cx="32" cy="32" r="20"/>

    <!-- Latitude lines -->
    <ellipse cx="32" cy="32" rx="20" ry="7"/>
    <ellipse cx="32" cy="24" rx="16" ry="5"/>
    <ellipse cx="32" cy="40" rx="16" ry="5"/>

    <!-- Longitude lines -->
    <ellipse cx="32" cy="32" rx="7" ry="20"/>
    <ellipse cx="32" cy="32" rx="14" ry="20"/>

    <!-- Equator highlight -->
    <line x1="12" y1="32" x2="52" y2="32" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Scan line effect -->
  <line x1="12" y1="28" x2="52" y2="28" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
</svg>
